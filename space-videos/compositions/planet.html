<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
    }
    #planet-wrap {
      position: absolute;
      left: 1000px;
      top: 200px;
      width: 680px;
      height: 680px;
    }
    #planet-glow {
      position: absolute;
      inset: -90px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(120, 170, 255, 0) 0 49%,
        rgba(120, 170, 255, 0.35) 51%,
        rgba(90, 130, 255, 0.12) 58%,
        rgba(60, 90, 220, 0) 70%
      );
    }
    #planet-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 680px;
      height: 680px;
    }
  </style>
  <div id="root" data-composition-id="planet" data-width="1920" data-height="1080">
    <div id="planet-wrap" data-layout-ignore>
      <div id="planet-glow"></div>
      <canvas id="planet-canvas" width="680" height="680"></canvas>
    </div>
  </div>
  <script>
    (function () {
      // A made-up gas giant, drawn pixel by pixel. Nothing here is random at render time:
      // the surface comes from a seeded hash, and every frame is a function of time only.
      const SIZE = 680;
      const R = 330; // planet radius in px
      const TEX_W = 1024;
      const TEX_H = 512;
      const ROT_PERIOD = 40; // seconds per full turn (slow, readable spin)
      const TILT = -0.32; // axial tilt in radians

      function hash(x, y) {
        const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return s - Math.floor(s);
      }
      function noise(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y);
        const xf = x - xi, yf = y - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      function fbm(x, y) {
        let t = 0, amp = 0.5, f = 1;
        for (let i = 0; i < 5; i++) { t += amp * noise(x * f, y * f); f *= 2; amp *= 0.5; }
        return t;
      }

      // Band colours: cream, tan, rust, deep brown, pale blue-grey.
      const BANDS = [
        [236, 222, 196], [214, 180, 140], [186, 120, 82], [232, 210, 170],
        [150, 96, 70], [210, 196, 180], [176, 150, 130], [228, 204, 160],
      ];
      function lerp(a, b, t) { return a + (b - a) * t; }

      // Precompute the equirectangular surface texture once.
      const tex = new Uint8ClampedArray(TEX_W * TEX_H * 3);
      for (let y = 0; y < TEX_H; y++) {
        const lat = y / TEX_H; // 0..1 top to bottom
        for (let x = 0; x < TEX_W; x++) {
          const lon = x / TEX_W;
          // Wrap noise around longitude so the seam is invisible.
          const ang = lon * Math.PI * 2;
          const nx = Math.cos(ang) * 2.2, nz = Math.sin(ang) * 2.2;
          const turb = fbm(nx + 10, lat * 6 + nz) - 0.5;
          let b = lat * BANDS.length * 1.6 + turb * 1.4;
          const i0 = ((Math.floor(b) % BANDS.length) + BANDS.length) % BANDS.length;
          const i1 = (i0 + 1) % BANDS.length;
          const f = b - Math.floor(b);
          const s = f * f * (3 - 2 * f);
          let r = lerp(BANDS[i0][0], BANDS[i1][0], s);
          let g = lerp(BANDS[i0][1], BANDS[i1][1], s);
          let bl = lerp(BANDS[i0][2], BANDS[i1][2], s);
          // A large oval storm in the southern bands.
          const dx = (((lon - 0.3 + 1.5) % 1) - 0.5) * 2 * 2.0, dy = (lat - 0.64) * 2 * 5.2;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < 1) {
            const k = Math.pow(1 - d, 0.7);
            r = lerp(r, 196, k); g = lerp(g, 90, k); bl = lerp(bl, 62, k);
          }
          const fine = (fbm(nx * 3 + 4, lat * 40) - 0.5) * 22;
          const o = (y * TEX_W + x) * 3;
          tex[o] = r + fine; tex[o + 1] = g + fine; tex[o + 2] = bl + fine;
        }
      }

      const canvas = document.getElementById("planet-canvas");
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(SIZE, SIZE);
      const data = img.data;
      const cx = SIZE / 2, cy = SIZE / 2;
      const ct = Math.cos(TILT), st = Math.sin(TILT);
      // Sun from the upper left, slightly in front.
      let Lx = -0.62, Ly = -0.38, Lz = 0.68;
      const Ll = Math.hypot(Lx, Ly, Lz); Lx /= Ll; Ly /= Ll; Lz /= Ll;

      function draw(time) {
        const rot = (time / ROT_PERIOD) * Math.PI * 2;
        data.fill(0);
        for (let py = 0; py < SIZE; py++) {
          const ny = (py - cy) / R;
          for (let px = 0; px < SIZE; px++) {
            const nx = (px - cx) / R;
            const rr = nx * nx + ny * ny;
            if (rr >= 1) continue;
            const nz = Math.sqrt(1 - rr);
            // Undo the tilt to get body coordinates.
            const bx = nx * ct + ny * st;
            const by = -nx * st + ny * ct;
            const lat = Math.asin(by); // -PI/2..PI/2
            let lon = Math.atan2(bx, nz) + rot;
            let u = lon / (Math.PI * 2);
            u = u - Math.floor(u);
            const v = lat / Math.PI + 0.5;
            const tx = Math.min(TEX_W - 1, (u * TEX_W) | 0);
            const ty = Math.min(TEX_H - 1, (v * TEX_H) | 0);
            const to = (ty * TEX_W + tx) * 3;
            // Lambert light, soft terminator, plus a little ambient.
            let lit = nx * Lx + ny * Ly + nz * Lz;
            lit = Math.max(0, lit);
            lit = 0.06 + 0.98 * Math.pow(lit, 0.85);
            // Limb darkening and a thin blue atmosphere at the edge.
            const limb = Math.pow(nz, 0.35);
            const rim = Math.pow(1 - nz, 3) * 0.9 * Math.max(0.15, lit);
            const edge = Math.min(1, (1 - Math.sqrt(rr)) * R * 0.9); // anti-aliased rim
            const o = (py * SIZE + px) * 4;
            data[o] = (tex[to] * lit * limb + 110 * rim);
            data[o + 1] = (tex[to + 1] * lit * limb + 160 * rim);
            data[o + 2] = (tex[to + 2] * lit * limb + 255 * rim);
            data[o + 3] = 255 * edge;
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 15, duration: 15, ease: "none", onUpdate: () => draw(state.t) }, 0);
      // Arrive: grow in and drift slightly left over the whole shot.
      tl.fromTo("#planet-wrap", { scale: 0.9, x: 40 }, { scale: 1, x: 0, duration: 2.4, ease: "power3.out" }, 0);
      tl.fromTo("#planet-wrap", { y: 0 }, { y: -24, duration: 15, ease: "sine.inOut" }, 0);
      draw(0);
      window.__timelines["planet"] = tl;
    })();
  </script>
</template>
