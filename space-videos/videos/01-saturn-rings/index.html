<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/brand/motion.js"></script>
    <script src="assets/brand/planets.js"></script>
    <link rel="stylesheet" href="assets/brand/brand.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--sv-bg-0);
      }
      #space-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 800px 900px at 80% 22%, var(--sv-nebula-a), transparent 70%),
          radial-gradient(ellipse 900px 800px at 10% 85%, var(--sv-nebula-b), transparent 70%),
          linear-gradient(180deg, var(--sv-bg-1) 0%, var(--sv-bg-0) 100%);
      }
      #warp {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      SCENE TIMING
      Scenes sit back to back and overlap by 0.5 s so the cosmic zoom can cross between them.
      Every cut time (the middle of each overlap) is listed in #root's data-warp, which fires
      a burst of star streaks. With a voiceover, each scene's length comes from its audio.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="49.916"
      data-width="1080"
      data-height="1920"
      data-warp="[5.411, 11.427, 21.936, 29.755, 34.413, 39.306, 44.904]"
    >
      <div id="space-bg" class="clip" data-start="0" data-duration="49.916" data-track-index="0" style="z-index: 1"></div>
      <div
        id="starfield"
        data-composition-id="starfield"
        data-composition-src="compositions/starfield.html"
        data-variable-values='{"density":"dense","tone":"cool","speed":"slow"}'
        data-start="0"
        data-duration="49.916"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>

      <!-- Scenes: one lane, back to back (with 0.5 s overlaps). -->
      <div
        id="scene-01"
        data-composition-id="scene-01"
        data-composition-src="compositions/scene-01.html"
        data-start="0"
        data-duration="5.661"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="scene-02"
        data-composition-id="scene-02"
        data-composition-src="compositions/scene-02.html"
        data-start="5.161"
        data-duration="6.516"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="scene-03"
        data-composition-id="scene-03"
        data-composition-src="compositions/scene-03.html"
        data-start="11.177"
        data-duration="11.009"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="scene-04"
        data-composition-id="scene-04"
        data-composition-src="compositions/scene-04.html"
        data-start="21.686"
        data-duration="8.319"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="scene-05"
        data-composition-id="scene-05"
        data-composition-src="compositions/scene-05.html"
        data-start="29.505"
        data-duration="5.158"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="scene-06"
        data-composition-id="scene-06"
        data-composition-src="compositions/scene-06.html"
        data-start="34.163"
        data-duration="5.393"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="scene-07"
        data-composition-id="scene-07"
        data-composition-src="compositions/scene-07.html"
        data-start="39.056"
        data-duration="6.098"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="scene-08"
        data-composition-id="scene-08"
        data-composition-src="compositions/scene-08.html"
        data-start="44.654"
        data-duration="5.262"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>

      <canvas id="warp" class="clip" width="1080" height="1920" data-start="0" data-duration="49.916" data-track-index="5" style="z-index: 6" data-layout-ignore></canvas>

      <!-- Captions: generated by `node ../../tools/build-captions.mjs` from script/words.json -->
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="49.916"
        data-track-index="6"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 7"
      ></div>

      <!-- Voiceover: filled in by `node ../../tools/voiceover.mjs videos/<name> --go` -->
      <!-- VOICE:BEGIN -->
      <audio id="vo-scene-01" class="clip" src="assets/voice/scene-01.mp3" data-start="0.2" data-duration="4.911" data-track-index="8" data-volume="1"></audio>
      <audio id="vo-scene-02" class="clip" src="assets/voice/scene-02.mp3" data-start="5.511" data-duration="5.616" data-track-index="8" data-volume="1"></audio>
      <audio id="vo-scene-03" class="clip" src="assets/voice/scene-03.mp3" data-start="11.527" data-duration="10.109" data-track-index="8" data-volume="1"></audio>
      <audio id="vo-scene-04" class="clip" src="assets/voice/scene-04.mp3" data-start="22.036" data-duration="7.419" data-track-index="8" data-volume="1"></audio>
      <audio id="vo-scene-05" class="clip" src="assets/voice/scene-05.mp3" data-start="29.855" data-duration="4.258" data-track-index="8" data-volume="1"></audio>
      <audio id="vo-scene-06" class="clip" src="assets/voice/scene-06.mp3" data-start="34.513" data-duration="4.493" data-track-index="8" data-volume="1"></audio>
      <audio id="vo-scene-07" class="clip" src="assets/voice/scene-07.mp3" data-start="39.406" data-duration="5.198" data-track-index="8" data-volume="1"></audio>
      <audio id="vo-scene-08" class="clip" src="assets/voice/scene-08.mp3" data-start="45.004" data-duration="4.362" data-track-index="8" data-volume="1"></audio>
      <!-- VOICE:END -->
    </div>
    <script>
      (function () {
        const root = document.getElementById("root");
        const DUR = parseFloat(root.getAttribute("data-duration"));
        const CUTS = JSON.parse(root.getAttribute("data-warp") || "[]");
        const canvas = document.getElementById("warp");
        const ctx = canvas.getContext("2d");
        const W = 1080, H = 1920, CX = 540, CY = 860;
        const N = 220;
        const streaks = [];
        for (let i = 0; i < N; i++) {
          streaks.push({ a: SV.rnd(i + 11) * Math.PI * 2, r0: SV.rnd(i + 91) * 900, v: 900 + SV.rnd(i + 37) * 1600, w: 1 + SV.rnd(i + 53) * 2.2 });
        }
        // Star-streak burst around each cut: a soft bell, ~0.9 s wide.
        function draw(t) {
          let k = 0;
          for (const c of CUTS) k = Math.max(k, Math.exp(-Math.pow((t - c) / 0.32, 2)));
          ctx.clearRect(0, 0, W, H);
          if (k < 0.01) return;
          ctx.lineCap = "round";
          for (const s of streaks) {
            const r = 60 + ((s.r0 + s.v * t) % 1100);
            const len = 40 + 260 * k * (r / 1100);
            const x1 = CX + Math.cos(s.a) * r, y1 = CY + Math.sin(s.a) * r * 1.4;
            const x2 = CX + Math.cos(s.a) * (r + len), y2 = CY + Math.sin(s.a) * (r + len) * 1.4;
            ctx.strokeStyle = "rgba(220,232,255," + (0.85 * k).toFixed(3) + ")";
            ctx.lineWidth = s.w;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }
        }
        const state = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(state.t) }, 0);
        // The nebula breathes slowly so the sky is never fully static.
        tl.fromTo("#space-bg", { opacity: 0.85 }, { opacity: 1, duration: DUR, ease: "sine.inOut" }, 0);
        draw(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
