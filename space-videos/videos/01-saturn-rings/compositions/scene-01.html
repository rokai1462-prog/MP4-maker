<template>
  <!-- SCENE 01 — HOOK. On screen from frame 0 (thumbnail). Words: disappearing@1.15 illusion@3.16 real@4.45 -->
  <style>
    #root { position: absolute; inset: 0; }
    #s01-inner { position: absolute; inset: 0; }
    #s01-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s01-text { top: 300px; }
    #s01-head { margin-top: 22px; }
    #s01-chips { position: absolute; left: var(--sv-side-left); right: var(--sv-side-right); top: 590px; display: flex; gap: 22px; }
    .s01-chip {
      font-family: var(--sv-font-title); font-weight: 700; font-size: 30px; letter-spacing: 0.08em;
      padding: 10px 22px; border-radius: 999px; border: 2px solid var(--sv-cool); color: var(--sv-ink);
      background: rgba(10, 15, 42, 0.6);
    }
    #s01-chip-b { border-color: var(--sv-accent); color: var(--sv-accent); }
  </style>
  <div id="root" data-composition-id="scene-01" data-width="1080" data-height="1920">
    <div id="s01-inner">
      <canvas id="s01-cv" width="1080" height="1920" data-layout-ignore></canvas>
      <div id="s01-text" class="sv-column">
        <div id="s01-kicker" class="sv-kicker">Saturn · Ep 01</div>
        <div id="s01-head" class="sv-headline">Saturn's rings are <em>disappearing</em></div>
      </div>
      <div id="s01-chips">
        <div id="s01-chip-a" class="s01-chip">① Illusion</div>
        <div id="s01-chip-b" class="s01-chip">② Real</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const DUR = SV.sceneDuration(document.getElementById("s01-inner"), 5.66);
      const ctx = document.getElementById("s01-cv").getContext("2d");
      const st = { t: 0, ring: 1 };
      function draw() {
        ctx.clearRect(0, 0, 1080, 1920);
        SV.saturn.draw(ctx, { cx: 540, cy: 900, R: 165, open: 0.42 + 0.03 * Math.sin(st.t * 0.6), tilt: -0.28, ringAlpha: st.ring, glow: 1 });
      }
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      // "disappearing": the rings flicker out and back.
      tl.to(st, { ring: 0.35, duration: 0.5, ease: "power2.inOut", onUpdate: draw }, 1.15);
      tl.to(st, { ring: 1, duration: 0.6, ease: "power2.inOut", onUpdate: draw }, 1.75);
      tl.fromTo("#s01-chip-a", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 3.1);
      tl.fromTo("#s01-chip-b", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 4.4);
      tl.fromTo("#s01-cv", { scale: 1 }, { scale: 1.05, transformOrigin: "540px 900px", duration: DUR, ease: "none" }, 0);
      SV.zoomOut(tl, "#s01-inner", DUR);
      draw();
      window.__timelines["scene-01"] = tl;
    })();
  </script>
