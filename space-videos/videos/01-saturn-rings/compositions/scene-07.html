<template>
  <!-- SCENE 07 — HOW LONG. Words: Cassini@0.79 falling@1.47 in@1.86 rings@2.52 less@3.24 100@3.65 million@4.15 years@4.51 left@4.82 -->
  <style>
    #root { position: absolute; inset: 0; }
    #s07-inner { position: absolute; inset: 0; }
    #s07-cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s07-text { top: 300px; }
    #s07-head { margin-top: 22px; }
    #s07-cassini { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s07-today { position: absolute; left: var(--sv-side-left); top: 945px; }
    #s07-gone { position: absolute; right: var(--sv-side-right); top: 945px; text-align: right; }
    #s07-tline { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="scene-07" data-width="1080" data-height="1920">
    <div id="s07-inner">
      <canvas id="s07-cv" width="1080" height="1920" data-layout-ignore></canvas>
      <div id="s07-text" class="sv-column">
        <div id="s07-kicker" class="sv-kicker">Cassini, 2017</div>
        <div id="s07-head" class="sv-headline">Maybe under <em>100 million</em> years left</div>
      </div>
      <svg id="s07-cassini" viewBox="0 0 1080 1920" data-layout-ignore>
        <g id="s07-craft">
          <path d="M 0 -26 L 0 34" stroke="#c9d4ee" stroke-width="3" />
          <ellipse cx="0" cy="-30" rx="26" ry="9" fill="#e9eef8" />
          <rect x="-9" y="-22" width="18" height="34" fill="#d9a441" />
          <rect x="-12" y="10" width="24" height="10" fill="#9aa6bf" />
        </g>
      </svg>
      <svg id="s07-tline" viewBox="0 0 1080 1920" data-layout-ignore>
        <path id="s07-line" d="M 140 925 L 880 925" stroke="#ffc37a" stroke-width="4" fill="none" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        <circle cx="140" cy="925" r="9" fill="#ffc37a" />
      </svg>
      <div id="s07-today" class="sv-label">today</div>
      <div id="s07-gone" class="sv-label">&lt; 100 million yrs</div>
    </div>
  </div>
  <script>
    (function () {
      const DUR = SV.sceneDuration(document.getElementById("s07-inner"), 6.1);
      const ctx = document.getElementById("s07-cv").getContext("2d");
      const CX = 540, CY = 800, R = 120;
      const st = { t: 0, ring: 1 };
      function draw() {
        const t = st.t;
        ctx.clearRect(0, 0, 1080, 1920);
        SV.saturn.draw(ctx, { cx: CX, cy: CY, R: R, open: 0.3, tilt: -0.15, ringAlpha: st.ring, glow: 0.8 });
        // Ring material falling into the equator (what Cassini measured), shown after "falling in".
        const k = Math.min(1, Math.max(0, (t - 1.4) / 0.4));
        if (k > 0) {
          for (let i = 0; i < 26; i++) {
            const f = ((t - 1.4) * (0.7 + SV.rnd(i) * 0.5) + SV.rnd(i + 50)) % 1;
            const side = i % 2 ? 1 : -1;
            const x0 = CX + side * R * 1.3, x1 = CX + side * R * 0.92;
            const x = x0 + (x1 - x0) * f, y = CY + Math.sin(-0.15) * (x - CX) + (SV.rnd(i + 80) - 0.5) * 8;
            ctx.fillStyle = "rgba(190,230,255," + (k * (1 - f)).toFixed(3) + ")";
            ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: draw }, 0);
      SV.zoomIn(tl, "#s07-inner");
      // Cassini dives through the gap between the rings and the planet.
      tl.fromTo("#s07-craft", { x: 930, y: 600, rotation: -40, opacity: 0 }, { x: 640, y: 790, rotation: -60, opacity: 1, duration: 0.9, ease: "power1.in" }, 0.7);
      tl.to("#s07-craft", { x: 420, y: 980, rotation: -90, opacity: 0, duration: 0.8, ease: "power1.in" }, 1.6);
      tl.fromTo("#s07-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.2);
      // Timeline: today -> under 100 million years, rings fading as it runs.
      SV.rise(tl, "#s07-today", 2.5);
      tl.to("#s07-line", { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 2.6);
      SV.rise(tl, "#s07-gone", 3.6);
      tl.to(st, { ring: 0.15, duration: 2.0, ease: "power1.inOut", onUpdate: draw }, 3.6);
      SV.zoomOut(tl, "#s07-inner", DUR);
      draw();
      window.__timelines["scene-07"] = tl;
    })();
  </script>
</template>
