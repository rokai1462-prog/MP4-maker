<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #04050d;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #space-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 900px 600px at 78% 30%, rgba(80, 60, 160, 0.28), transparent 70%),
          radial-gradient(ellipse 800px 500px at 15% 85%, rgba(30, 90, 150, 0.22), transparent 70%),
          linear-gradient(180deg, #050716 0%, #04050d 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div id="space-bg" class="clip" data-start="0" data-duration="15" data-track-index="0" style="z-index: 1"></div>
      <div
        id="starfield"
        data-composition-id="starfield"
        data-composition-src="compositions/starfield.html"
        data-variable-values='{"density":"dense","tone":"cool","speed":"slow"}'
        data-start="0"
        data-duration="15"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="planet"
        data-composition-id="planet"
        data-composition-src="compositions/planet.html"
        data-start="0"
        data-duration="15"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="title"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="0"
        data-duration="9"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="15"
        data-track-index="4"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Slow nebula breathing so the background is never fully static.
      tl.fromTo("#space-bg", { opacity: 0.85 }, { opacity: 1, duration: 15, ease: "sine.inOut" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
