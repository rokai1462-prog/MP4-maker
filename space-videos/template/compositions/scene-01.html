      <div id="s01-stage" data-layout-ignore>

        <svg id="s01-orbit" viewBox="0 0 800 460">

  <script>
    (function () {
      const DUR = SV.sceneDuration(document.getElementById("s01-inner"), 5);
      const tl = gsap.timeline({ paused: true });
      // Already on screen at frame 0; small accents animate in.
      tl.fromTo("#s01-text", { y: 0 }, { y: -12, duration: DUR, ease: "none" }, 0);
      SV.drift(tl, "#s01-stage", DUR);
      // Moon on its orbit: position is a pure function of time.
      const orbit = { p: 0.1 };
      const moon = document.getElementById("s01-moon");
      const place = () => {
        const a = orbit.p * Math.PI * 2;
        moon.setAttribute("cx", (400 + Math.cos(a) * 370).toFixed(2));
        moon.setAttribute("cy", (230 + Math.sin(a) * 110).toFixed(2));
      };
      tl.to(orbit, { p: 0.1 + DUR / 12, duration: DUR, ease: "none", onUpdate: place }, 0);
      place();
      SV.zoomOut(tl, "#s01-inner", DUR);
      window.__timelines["scene-01"] = tl;
    })();
